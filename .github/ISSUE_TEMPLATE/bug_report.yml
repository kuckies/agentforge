name: Ошибка
description: Воспроизводимая проблема в AgentForge
title: "[Ошибка] "
body:
  - type: input
    id: version
    attributes:
      label: Версия AgentForge
      description: Значение из файла VERSION
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Среда
      placeholder: Windows 11, Python 3.14 x64
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Как повторить
      description: Шаги и небольшой вымышленный сценарий без ключей и личных данных
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемый результат
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактический результат и текст ошибки
    validations:
      required: true
